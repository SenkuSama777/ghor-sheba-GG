{% extends "base.html" %}
{% block content %}
<div class="plate" style="max-width: 560px; margin: 0 auto;">
  <h1 style="font-size:1.7rem;">Edit your profile</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Business / trade name</label>
    <input type="text" name="business_name" value="{{ profile.business_name }}" required>
    <div class="field-row">
      <div>
        <label>Category</label>
        <select name="category">
          {% for key, label in categories %}<option value="{{ key }}" {% if key == profile.category %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>District you serve</label>
        <select name="district">
          {% for d in districts %}<option value="{{ d }}" {% if d == profile.district %}selected{% endif %}>{{ d }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <label>Address</label>
    <input type="text" name="address" value="{{ profile.address or '' }}">
    <label>Years of experience</label>
    <input type="text" name="years_experience" value="{{ profile.years_experience }}">
    <label>Visit / call-out fee (&#8377;) — optional</label>
    <input type="text" name="visit_fee" value="{{ profile.visit_fee or '' }}" placeholder="e.g. 150 — leave blank if not applicable">
    <label>Description</label>
    <textarea name="description">{{ profile.description or '' }}</textarea>
    <div style="margin-top:20px;"><button class="btn" type="submit">Save</button></div>
  </form>
</div>
{% endblock %}
