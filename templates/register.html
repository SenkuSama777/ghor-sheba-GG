{% extends "base.html" %}
{% block content %}
<div class="plate" style="max-width: 560px; margin: 0 auto;">
  <h1 style="font-size:1.7rem;">Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field-row">
      <div>
        <label>Full name</label>
        <input type="text" name="name" required>
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" name="phone">
      </div>
    </div>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required minlength="6">

    <fieldset>
      <legend>I am a</legend>
      <div class="radio-group">
        <label><input type="radio" name="role" value="customer" checked onclick="toggleProvider(false)"> Customer looking for services</label>
        <label><input type="radio" name="role" value="provider" onclick="toggleProvider(true)"> Service provider</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Where are you right now?</legend>
      <div class="radio-group">
        <label><input type="radio" name="based_in_tripura" value="yes" checked onclick="toggleLocation(false)"> Currently in Tripura</label>
        <label><input type="radio" name="based_in_tripura" value="no" onclick="toggleLocation(true)"> Living elsewhere</label>
      </div>
      <div id="location-field" style="display:none;">
        <label>Current city / country</label>
        <input type="text" name="current_location" placeholder="e.g. Bengaluru, Dubai">
      </div>
    </fieldset>

    <div id="provider-fields" style="display:none;">
      <fieldset>
        <legend>Business details</legend>
        <label>Business / trade name</label>
        <input type="text" name="business_name">
        <div class="field-row">
          <div>
            <label>Category</label>
            <select name="category">
              {% for key, label in categories %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label>District you serve</label>
            <select name="district">
              {% for d in districts %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <label>Years of experience</label>
        <input type="text" name="years_experience" value="0">
        <label>Visit / call-out fee (&#8377;) — optional</label>
        <input type="text" name="visit_fee" placeholder="e.g. 150 — leave blank if not applicable">
        <p style="font-size:0.82rem; color:var(--concrete); margin-top:2px;">
          What you charge just to come look at a job, before any work is agreed. Leave
          blank if you don't charge one (common for materials suppliers).
        </p>
        <label>Short description of your work</label>
        <textarea name="description" placeholder="What you do, materials you supply, past projects..."></textarea>
      </fieldset>
    </div>

    <div style="margin-top:20px;"><button class="btn" type="submit">Create account</button></div>
  </form>
</div>

<script>
function toggleProvider(show) {
  document.getElementById('provider-fields').style.display = show ? 'block' : 'none';
}
function toggleLocation(show) {
  document.getElementById('location-field').style.display = show ? 'block' : 'none';
}
</script>
{% endblock %}
